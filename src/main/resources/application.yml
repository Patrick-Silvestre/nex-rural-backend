# Configuracoes principais do Spring Boot para o AgroMach.
spring:
  application:
    name: AgroMach

  # Banco local padrao para rodar sem Docker/PostgreSQL.
  # Os dados ficam persistidos em ./data/agromach-local.mv.db.
  datasource:
    url: jdbc:h2:file:./data/agromach-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8081

app:
  jwt:
    secret: c3VwZXItY2hhdmUtc2VjcmV0YS1wYXJhLWFncm9tYWNoLWp3dC1oczI1Ng==
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
