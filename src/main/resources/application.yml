# Configuracoes principais do Spring Boot para a API AgroMach.
spring:
  # Identificacao da aplicacao no ecossistema Spring (logs, actuator, etc.).
  application:
    name: AgroMach

  # Configuracao de conexao com PostgreSQL.
  # Valores apos ":" sao fallback de dev local; em producao defina as env vars (nunca versione credenciais reais).
  datasource:
    # Porta 15432 = porta externa do container Docker.
    url: ${DB_URL:jdbc:postgresql://localhost:15432/agromach_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Configuracao de persistencia JPA/Hibernate.
  jpa:
    hibernate:
      # update = cria/atualiza tabelas automaticamente com base nas entidades.
      ddl-auto: update
    # Habilita log SQL no console para facilitar debug.
    show-sql: true
    properties:
      hibernate:
        # Formata SQL no log para leitura humana.
        format_sql: true
        jdbc:
          # Padroniza datas/horas em UTC no JDBC.
          time_zone: UTC

# Porta HTTP da API.
server:
  port: 8081

# Configuracoes de autenticacao JWT da aplicacao.
app:
  jwt:
    # Chave secreta em Base64 usada para assinar e validar tokens.
    # Fallback de dev local (rotacionada); em producao defina JWT_SECRET com um valor proprio e nunca versione.
    secret: ${JWT_SECRET:D6TSkqfWb+6V5UUNNDM8OxsLgVz8ygaAD16MlsbEhRg=}
    # Tempo de expiracao do token (24h em milissegundos).
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap:
    # Cria o admin padrao no startup se ainda nao existir. Desative em producao via APP_BOOTSTRAP_SEED_ADMIN=false.
    seed-admin: ${APP_BOOTSTRAP_SEED_ADMIN:true}
    # Fallback de dev local; em producao defina APP_BOOTSTRAP_ADMIN_PASSWORD com uma senha forte propria.
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}

# Configuracoes da documentacao OpenAPI/Swagger.
springdoc:
  api-docs:
    # Endpoint JSON do contrato OpenAPI.
    path: /v3/api-docs
  swagger-ui:
    # URL da interface Swagger.
    path: /swagger-ui.html
    # Ordena operacoes por metodo HTTP.
    operationsSorter: method
