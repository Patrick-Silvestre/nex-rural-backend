<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Pedidos', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-semibold mb-0"><i class="bi bi-bag-check text-danger me-2"></i>Pedidos</h5>
        <a th:href="@{/pedidos/new}" class="btn btn-agro btn-sm"><i class="bi bi-plus-circle me-1"></i>Novo Pedido</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Comprador</th>
                        <th>Produto</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum pedido cadastrado.</td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}">1</td>
                        <td th:text="${pedido.compradorNome}">Comprador</td>
                        <td th:text="${pedido.produtoTitulo}">Produto</td>
                        <td><span class="badge" th:classappend="${'badge-' + pedido.status}" th:text="${pedido.status}">PENDENTE</span></td>
                        <td class="text-end">
                            <a th:href="@{/pedidos/{id}/edit(id=${pedido.id})}" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/pedidos/{id}/delete(id=${pedido.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir este pedido?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
