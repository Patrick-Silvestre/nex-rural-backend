<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${pedido.id == null ? 'Novo Pedido' : 'Editar Pedido'}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <h6 class="fw-semibold mb-4" th:text="${pedido.id == null ? 'Novo Pedido' : 'Editar Pedido'}">Pedido</h6>
                <form th:action="@{/pedidos/save}" method="post">
                    <input type="hidden" name="id" th:value="${pedido.id}"/>

                    <div class="mb-3">
                        <label class="form-label">Produto <span class="text-danger">*</span></label>
                        <select name="produtoId" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="produto : ${produtos}"
                                    th:value="${produto.id}"
                                    th:text="${produto.titulo + ' - R$ ' + produto.preco}"
                                    th:selected="${produto.id == pedido.produtoId}"></option>
                        </select>
                        <div th:if="${#lists.isEmpty(produtos)}" class="form-text text-danger">
                            Cadastre um produto antes de criar pedidos.
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Status <span class="text-danger">*</span></label>
                        <select name="status" class="form-select" required>
                            <option th:each="s : ${statusList}" th:value="${s}" th:text="${s}" th:selected="${s == pedido.status}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-agro" th:disabled="${#lists.isEmpty(produtos)}"><i class="bi bi-floppy me-1"></i>Salvar</button>
                        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
