<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Funcionários', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-semibold mb-0"><i class="bi bi-people text-warning me-2"></i>Funcionários</h5>
        <a th:href="@{/funcionarios/new}" class="btn btn-agro btn-sm"><i class="bi bi-plus-lg me-1"></i>Novo Funcionário</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>#</th><th>Nome</th><th>Cargo</th><th>Salário</th><th>Admissão</th><th>Fazenda</th><th>Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(funcionarios)}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhum funcionário cadastrado.</td>
                    </tr>
                    <tr th:each="f : ${funcionarios}">
                        <td class="text-muted small" th:text="${f.id}"></td>
                        <td class="fw-medium" th:text="${f.nome}"></td>
                        <td th:text="${f.cargo}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(f.salario, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="${#temporals.format(f.dataAdmissao, 'dd/MM/yyyy')}"></td>
                        <td th:text="${f.fazendaNome}"></td>
                        <td>
                            <a th:href="@{/funcionarios/{id}/edit(id=${f.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/funcionarios/{id}/delete(id=${f.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir este funcionário?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
