<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${funcionario.id == null ? 'Novo Funcionário' : 'Editar Funcionário'}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <h6 class="fw-semibold mb-4" th:text="${funcionario.id == null ? 'Novo Funcionário' : 'Editar Funcionário'}">Funcionário</h6>
                <form th:action="@{/funcionarios/save}" method="post">
                    <input type="hidden" name="id" th:value="${funcionario.id}"/>

                    <div class="mb-3">
                        <label class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" name="nome" class="form-control" th:value="${funcionario.nome}" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cargo <span class="text-danger">*</span></label>
                        <input type="text" name="cargo" class="form-control" th:value="${funcionario.cargo}" required/>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salário (R$) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="salario" class="form-control" th:value="${funcionario.salario}" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data de Admissão <span class="text-danger">*</span></label>
                            <input type="date" name="dataAdmissao" class="form-control" th:value="${funcionario.dataAdmissao}" required/>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Fazenda <span class="text-danger">*</span></label>
                        <select name="fazendaId" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="f : ${fazendas}" th:value="${f.id}" th:text="${f.nome}" th:selected="${f.id == funcionario.fazendaId}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-agro"><i class="bi bi-floppy me-1"></i>Salvar</button>
                        <a th:href="@{/funcionarios}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
