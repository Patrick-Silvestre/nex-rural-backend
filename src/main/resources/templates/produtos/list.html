<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Produtos', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-semibold mb-0"><i class="bi bi-shop text-info me-2"></i>Marketplace de Produtos</h5>
        <a th:href="@{/produtos/new}" class="btn btn-agro btn-sm"><i class="bi bi-plus-lg me-1"></i>Novo Produto</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>#</th><th>Título</th><th>Categoria</th><th>Preço</th><th>Vendedor</th><th>Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="p : ${produtos}">
                        <td class="text-muted small" th:text="${p.id}"></td>
                        <td class="fw-medium" th:text="${p.titulo}"></td>
                        <td><span class="badge bg-info text-dark" th:text="${p.categoria}"></span></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="${p.vendedorNome}"></td>
                        <td>
                            <a th:href="@{/produtos/{id}/edit(id=${p.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/produtos/{id}/delete(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir este produto?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
