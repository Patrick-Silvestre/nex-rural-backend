<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${produto.id == null ? 'Novo Produto' : 'Editar Produto'}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <h6 class="fw-semibold mb-4" th:text="${produto.id == null ? 'Novo Produto' : 'Editar Produto'}">Produto</h6>
                <form th:action="@{/produtos/save}" method="post">
                    <input type="hidden" name="id" th:value="${produto.id}"/>

                    <div class="mb-3">
                        <label class="form-label">Título <span class="text-danger">*</span></label>
                        <input type="text" name="titulo" class="form-control" th:value="${produto.titulo}" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição <span class="text-danger">*</span></label>
                        <textarea name="descricao" class="form-control" rows="4" required th:text="${produto.descricao}"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Categoria <span class="text-danger">*</span></label>
                            <select name="categoria" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}" th:selected="${c == produto.categoria}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label">Preço <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0.01" name="preco" class="form-control" th:value="${produto.preco}" required/>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-agro"><i class="bi bi-floppy me-1"></i>Salvar</button>
                        <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
