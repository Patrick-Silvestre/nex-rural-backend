<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | AgroMach'">AgroMach</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #1a3c2e; }
        .sidebar .brand { color: #7ecb8e; font-weight: 700; font-size: 1.3rem; padding: 1.25rem 1rem; border-bottom: 1px solid #2e5c44; }
        .sidebar .nav-link { color: #c8e6d0; padding: .6rem 1rem; border-radius: .375rem; margin: .1rem .5rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2e5c44; color: #fff; }
        .sidebar .nav-link i { width: 1.4rem; }
        .sidebar .nav-section { color: #6dab82; font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: .75rem 1rem .25rem; }
        .topbar { background: #fff; border-bottom: 1px solid #dee2e6; padding: .75rem 1.5rem; }
        .main-content { padding: 1.5rem; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
        .btn-agro { background: #1a3c2e; color: #fff; }
        .btn-agro:hover { background: #2e5c44; color: #fff; }
        .badge-OPERACIONAL { background-color: #198754; }
        .badge-MANUTENCAO { background-color: #dc3545; }
        .badge-PENDENTE { background-color: #ffc107; color: #000; }
        .badge-APROVADO { background-color: #198754; }
        .badge-CANCELADO { background-color: #dc3545; }
    </style>
</head>

<body th:fragment="layout(title, content)" class="d-flex">
    <nav class="sidebar d-flex flex-column" style="width:240px;flex-shrink:0;">
        <div class="brand"><i class="bi bi-tree-fill me-2"></i>AgroMach</div>
        <ul class="nav flex-column flex-grow-1 pt-2">
            <li class="nav-item"><a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest.requestURI == '/' ? ' active' : ''}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><span class="nav-section">Gestão</span></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/fazendas}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/fazendas') ? ' active' : ''}"><i class="bi bi-geo-alt"></i> Fazendas</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/maquinas}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/maquinas') ? ' active' : ''}"><i class="bi bi-gear"></i> Máquinas</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/funcionarios}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/funcionarios') ? ' active' : ''}"><i class="bi bi-people"></i> Funcionários</a></li>
            <li><span class="nav-section">Mercado</span></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/produtos}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/produtos') ? ' active' : ''}"><i class="bi bi-shop"></i> Produtos</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/pedidos') ? ' active' : ''}"><i class="bi bi-bag-check"></i> Pedidos</a></li>
            <li><span class="nav-section">Comunidade</span></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/postagens}" th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/postagens') ? ' active' : ''}"><i class="bi bi-file-text"></i> Postagens</a></li>
        </ul>
        <div class="p-3 border-top" style="border-color:#2e5c44 !important;">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm w-100" style="color:#c8e6d0;background:transparent;border:1px solid #2e5c44;">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </form>
        </div>
    </nav>

    <div class="flex-grow-1 d-flex flex-column">
        <div class="topbar d-flex align-items-center justify-content-between">
            <h6 class="mb-0 fw-semibold" th:text="${title}">Página</h6>
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-circle text-muted"></i>
                <span class="text-muted small" sec:authentication="name">Usuário</span>
            </div>
        </div>
        <div class="main-content flex-grow-1">
            <th:block th:replace="${content}"/>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
