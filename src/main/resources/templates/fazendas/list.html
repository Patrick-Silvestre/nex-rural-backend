<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Fazendas', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-semibold mb-0"><i class="bi bi-geo-alt text-success me-2"></i>Fazendas</h5>
        <a th:href="@{/fazendas/new}" class="btn btn-agro btn-sm"><i class="bi bi-plus-lg me-1"></i>Nova Fazenda</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th><th>Nome</th><th>Localização</th><th>Tamanho (ha)</th><th>Tipo Produção</th><th>Proprietário</th><th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(fazendas)}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhuma fazenda cadastrada.</td>
                    </tr>
                    <tr th:each="f : ${fazendas}">
                        <td class="text-muted small" th:text="${f.id}"></td>
                        <td class="fw-medium" th:text="${f.nome}"></td>
                        <td th:text="${f.localizacao}"></td>
                        <td th:text="${f.tamanhoHectares}"></td>
                        <td th:text="${f.tipoProducao}"></td>
                        <td th:text="${f.proprietarioNome}"></td>
                        <td>
                            <a th:href="@{/fazendas/{id}/edit(id=${f.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/fazendas/{id}/delete(id=${f.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir esta fazenda?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
