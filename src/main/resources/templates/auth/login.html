<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login | AgroMach</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a3c2e 0%, #2e7d52 100%); min-height: 100vh; }
        .login-card { border-radius: 1rem; max-width: 400px; }
        .brand-logo { color: #1a3c2e; font-size: 1.8rem; font-weight: 800; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="w-100 p-3">
        <div class="login-card card shadow-lg mx-auto p-4">
            <div class="text-center mb-4">
                <div class="brand-logo"><i class="bi bi-tree-fill text-success"></i> AgroMach</div>
                <p class="text-muted small mt-1">Sistema de Gestão Agrícola</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <div th:if="${msg}" class="alert alert-success py-2 small" th:text="${msg}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-medium">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="username" class="form-control" placeholder="seu@email.com" required autofocus/>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••" required/>
                    </div>
                </div>
                <button type="submit" class="btn w-100 fw-semibold" style="background:#1a3c2e;color:#fff;">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
