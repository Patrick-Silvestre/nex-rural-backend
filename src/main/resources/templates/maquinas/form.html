<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${maquina.id == null ? 'Nova Máquina' : 'Editar Máquina'}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <h6 class="fw-semibold mb-4" th:text="${maquina.id == null ? 'Nova Máquina' : 'Editar Máquina'}">Máquina</h6>
                <form th:action="@{/maquinas/save}" method="post">
                    <input type="hidden" name="id" th:value="${maquina.id}"/>

                    <div class="mb-3">
                        <label class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" name="nome" class="form-control" th:value="${maquina.nome}" required/>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tipo <span class="text-danger">*</span></label>
                            <select name="tipo" class="form-select" required>
                                <option th:each="t : ${tiposMaquina}" th:value="${t}" th:text="${t}" th:selected="${t == maquina.tipo}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status <span class="text-danger">*</span></label>
                            <select name="status" class="form-select" required>
                                <option th:each="s : ${statusMaquina}" th:value="${s}" th:text="${s}" th:selected="${s == maquina.status}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ano <span class="text-danger">*</span></label>
                            <input type="number" name="ano" class="form-control" th:value="${maquina.ano}" min="1900" max="2100" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Valor Estimado (R$) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="valorEstimado" class="form-control" th:value="${maquina.valorEstimado}" required/>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Fazenda <span class="text-danger">*</span></label>
                        <select name="fazendaId" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="f : ${fazendas}" th:value="${f.id}" th:text="${f.nome}" th:selected="${f.id == maquina.fazendaId}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-agro"><i class="bi bi-floppy me-1"></i>Salvar</button>
                        <a th:href="@{/maquinas}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
