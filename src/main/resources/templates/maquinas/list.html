<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Máquinas', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-semibold mb-0"><i class="bi bi-gear text-primary me-2"></i>Máquinas</h5>
        <a th:href="@{/maquinas/new}" class="btn btn-agro btn-sm"><i class="bi bi-plus-lg me-1"></i>Nova Máquina</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>#</th><th>Nome</th><th>Tipo</th><th>Status</th><th>Ano</th><th>Valor Estimado</th><th>Fazenda</th><th>Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(maquinas)}">
                        <td colspan="8" class="text-center text-muted py-4">Nenhuma máquina cadastrada.</td>
                    </tr>
                    <tr th:each="m : ${maquinas}">
                        <td class="text-muted small" th:text="${m.id}"></td>
                        <td class="fw-medium" th:text="${m.nome}"></td>
                        <td th:text="${m.tipo}"></td>
                        <td><span class="badge" th:text="${m.status}" th:classappend="'badge-' + ${m.status}"></span></td>
                        <td th:text="${m.ano}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(m.valorEstimado, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="${m.fazendaNome}"></td>
                        <td>
                            <a th:href="@{/maquinas/{id}/edit(id=${m.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/maquinas/{id}/delete(id=${m.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir esta máquina?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
