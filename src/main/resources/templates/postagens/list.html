<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Postagens', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-semibold mb-0"><i class="bi bi-file-text text-secondary me-2"></i>Postagens</h5>
        <a th:href="@{/postagens/new}" class="btn btn-agro btn-sm"><i class="bi bi-plus-lg me-1"></i>Nova Postagem</a>
    </div>
    <div class="row g-3">
        <div th:if="${#lists.isEmpty(postagens)}" class="col-12">
            <div class="card p-4 text-center text-muted">Nenhuma postagem cadastrada.</div>
        </div>
        <div class="col-md-6 col-xl-4" th:each="p : ${postagens}">
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title fw-semibold" th:text="${p.titulo}"></h6>
                    <p class="card-text text-muted small" th:text="${#strings.abbreviate(p.conteudo, 120)}"></p>
                </div>
                <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                    <div class="text-muted small">
                        <i class="bi bi-person me-1"></i><span th:text="${p.autorNome}"></span><br/>
                        <i class="bi bi-calendar me-1"></i><span th:text="${#temporals.format(p.dataCriacao, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                    <div>
                        <a th:href="@{/postagens/{id}/edit(id=${p.id})}" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/postagens/{id}/delete(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir esta postagem?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
